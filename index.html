<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>

```
<style>
    body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        overflow: hidden;
    }

    .caixa {
        width: 500px;
        max-width: 80%;
        background: #222;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    .barra {
        width: 100%;
        height: 25px;
        background: #444;
        border-radius: 20px;
        overflow: hidden;
        margin: 20px 0;
    }

    .progresso {
        width: 0%;
        height: 100%;
        background: #00cc66;
    }

    #final,
    #fim {
        display: none;
    }

    .janela {
        position: absolute;
        width: 280px;
        height: 130px;
        background: black;
        color: #00ff00;
        border: 2px solid #aaa;
        padding: 10px;
        box-sizing: border-box;
        font-family: monospace;
        z-index: 10;
    }

    .titulo {
        color: white;
        border-bottom: 1px solid #777;
        padding-bottom: 5px;
        margin-bottom: 10px;
    }
</style>
```

</head>

<body>

```
<!-- TELA DE DOWNLOAD -->
<div class="caixa" id="download">
    <h2>Baixando arquivo...</h2>

    <div class="barra">
        <div class="progresso" id="progresso"></div>
    </div>

    <p id="porcentagem">0%</p>
</div>


<!-- TELA APÓS O CARREGAMENTO -->
<div class="caixa" id="final">
    <h2>Dados salvos com sucesso!</h2>
    <p>Arquivo carregado com sucesso.</p>
</div>


<!-- TELA FINAL -->
<div class="caixa" id="fim">
    <h2>FIM</h2>
    <p>Era só uma trolagem!</p>
</div>


<script>

    /* =========================
       CARREGAMENTO
       ========================= */

    let porcentagem = 0;

    let intervalo = setInterval(function() {

        porcentagem++;

        document.getElementById("progresso").style.width =
            porcentagem + "%";

        document.getElementById("porcentagem").textContent =
            porcentagem + "%";


        if (porcentagem >= 100) {

            clearInterval(intervalo);

            // Esconde o download
            document.getElementById("download").style.display =
                "none";

            // Mostra a mensagem final
            document.getElementById("final").style.display =
                "block";

            // Espera 700 ms antes das janelas
            setTimeout(iniciarJanelas, 700);
        }

    }, 10);


    /* =========================
       JANELAS FALSAS
       ========================= */

    function iniciarJanelas() {

        // Esconde a mensagem anterior
        document.getElementById("final").style.display =
            "none";

        let numero = 0;

        let intervaloJanelas = setInterval(function() {

            numero++;

            let janela = document.createElement("div");

            janela.className = "janela";

            janela.innerHTML = `
                <div class="titulo">Sistema</div>
                <p>⚠ Processando...</p>
                <p>Janela ${numero}</p>
            `;


            // Posição aleatória
            janela.style.left =
                Math.random() *
                Math.max(0, window.innerWidth - 300) + "px";

            janela.style.top =
                Math.random() *
                Math.max(0, window.innerHeight - 150) + "px";


            document.body.appendChild(janela);


            // Remove a janela depois de 700 ms
            setTimeout(function() {
                janela.remove();
            }, 700);


            // Para depois de 50 janelas
            if (numero >= 50) {

                clearInterval(intervaloJanelas);

                // Espera 1 segundo e mostra a tela final
                setTimeout(function() {

                    document.getElementById("fim").style.display =
                        "block";

                }, 1000);
            }

        }, 150);
    }

</script>
```

</body>
